<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ENTREPRENEURSHIP</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            padding: 2rem;
        }
        .auth-form-box {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .auth-form-box h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .auth-form-box p {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }
        .auth-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        .auth-buttons button {
            flex: 1;
        }
        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-light);
        }
        .auth-link a {
            color: var(--primary-color);
            font-weight: 600;
        }
        .demo-info {
            background-color: #f0f4f8;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--info-color);
        }
        .demo-info strong {
            color: var(--info-color);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-box">
            <h2>Welcome Back</h2>
            <p>Sign in to your ENTREPRENEURSHIP account</p>
            
            <div class="demo-info">
                <strong>Demo Mode:</strong> Use any email/password combination to login
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="user-type">I am a:</label>
                    <select id="user-type" required>
                        <option value="entrepreneur">Entrepreneur (Idea Owner)</option>
                        <option value="investor">Investor / Capital Provider</option>
                        <option value="admin">ENTREPRENEURSHIP Team</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Sign In</button>
            </form>

            <div class="auth-link">
                Don't have an account? <a href="signup.html">Create one</a>
            </div>

            <div class="auth-link" style="margin-top: 1rem;">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
