<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Dashboard - ENTREPRENEURSHIP</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            background-color: var(--secondary-color);
        }
        .dashboard-sidebar {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .dashboard-sidebar h3 {
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .sidebar-menu {
            list-style: none;
        }
        .sidebar-menu li {
            margin-bottom: 0.5rem;
        }
        .sidebar-menu a {
            display: block;
            padding: 0.75rem 1rem;
            color: rgba(255, 255, 255, 0.8);
            border-radius: 0.5rem;
            transition: all 0.3s;
        }
        .sidebar-menu a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .dashboard-content {
            padding: 2rem;
        }
        .dashboard-header {
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .dashboard-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-box {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            text-align: center;
        }
        .stat-box h3 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .opportunities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        .opportunity-card {
            background-color: white;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .opportunity-card-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .opportunity-card-header h3 {
            color: var(--primary-color);
        }
        .opportunity-card-body {
            padding: 1.5rem;
            font-size: 0.95rem;
        }
        .opportunity-card-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }
        .opportunity-card-footer button {
            flex: 1;
        }
        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-approved {
            background-color: #d1fae5;
            color: #065f46;
        }
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="dashboard-sidebar">
            <h3>💰 Investor</h3>
            <ul class="sidebar-menu">
                <li><a href="investor-dashboard.html">📊 Dashboard</a></li>
                <li><a href="opportunities.html">🎯 All Opportunities</a></li>
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="#" onclick="logout()">🚪 Logout</a></li>
            </ul>
        </aside>

        <main class="dashboard-content">
            <div class="dashboard-header">
                <h1>Welcome, <span id="user-name">Investor</span>!</h1>
                <p id="user-email">your@email.com</p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-box">
                    <h3>3</h3>
                    <p>Available Opportunities</p>
                </div>
                <div class="stat-box">
                    <h3>25-35%</h3>
                    <p>Expected ROI</p>
                </div>
                <div class="stat-box">
                    <h3>KSh 11.3M</h3>
                    <p>Total Funding Available</p>
                </div>
            </div>

            <h2 style="font-size: 1.5rem; color: var(--primary-color); margin: 2rem 0 1rem;">Available Opportunities</h2>
            <div id="opportunities-container" class="opportunities-grid"></div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadInvestorDashboard();
        });
    </script>
</body>
</html>
